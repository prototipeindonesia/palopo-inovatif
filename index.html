<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#132c4f" />
<meta name="description" content="Palopo Inovatif — Platform Pelatihan Mandiri Bidang Riset dan Inovasi Daerah Bapperida Kota Palopo" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Palopo Inovatif — Platform Pelatihan Mandiri</title>

<!-- Favicon (emoji) -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
    </div>
    <h1>Palopo Inovatif</h1>
    <p class="sub">Platform Pelatihan Mandiri<br>Bidang Riset dan Inovasi Daerah — Bapperida Kota Palopo</p>

    <div class="tabs">
      <button id="tabLogin" class="active" type="button" onclick="switchAuth('login')">Masuk</button>
      <button id="tabReg" type="button" onclick="switchAuth('reg')">Daftar</button>
    </div>

    <!-- FORM LOGIN -->
    <form id="loginForm" onsubmit="doLogin(event)">
      <div class="field">
        <label>Email</label>
        <input type="email" id="loginEmail" required placeholder="nama@email.com" autocomplete="email" />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="loginPass" required placeholder="••••••••" autocomplete="current-password" />
      </div>
      <button class="btn btn-primary" type="submit">🔐 Masuk</button>
      <button class="btn-forgot" type="button" onclick="openForgotPassword()">Lupa password?</button>
    </form>

    <!-- FORM REGISTER -->
    <form id="regForm" class="hidden" onsubmit="doRegister(event)">
      <div class="field">
        <label>Nama Lengkap</label>
        <input type="text" id="regName" required placeholder="Nama sesuai NIP" />
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="regEmail" required placeholder="nama@email.com" autocomplete="email" />
      </div>
      <div class="field">
        <label>NIP</label>
        <input type="text" id="regNip" required placeholder="18 digit NIP" />
      </div>
      <div class="field">
        <label>OPD / Instansi</label>
        <input type="text" id="regOpd" required placeholder="Contoh: Bapperida" />
      </div>
      <div class="field">
        <label>Nomor WhatsApp</label>
        <input type="tel" id="regTel" required placeholder="08xxxxxxxxxx" />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="regPass" required minlength="6" placeholder="Min. 6 karakter" autocomplete="new-password" />
      </div>
      <button class="btn btn-primary" type="submit">📝 Daftar Sekarang</button>
    </form>

    <div class="divider"><span>atau</span></div>

    <button class="btn-google" type="button" onclick="loginWithGoogle()">
      <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.1 18.9 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.1-11.3-7.5l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4.1 5.6l6.2 5.2C41.1 35.3 44 30.1 44 24c0-1.2-.1-2.4-.4-3.5z"/></svg>
      Masuk dengan Google
    </button>

    <p class="login-note">Hak akses admin ditentukan oleh Bapperida Kota Palopo.</p>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="ico">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
      </div>
      <div><h2>Palopo Inovatif</h2><span>Bapperida Kota Palopo</span></div>
    </div>
    <div id="navMenu"></div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="left">
        <button class="hamburger" onclick="toggleSidebar()" type="button">☰</button>
        <h3 id="pageTitle">Dashboard</h3>
      </div>
      <div class="right">
        <div class="user-chip">
          <div class="avatar" id="topAvatar">U</div>
          <div class="info"><b id="topName">User</b><span id="topRole">Peserta</span></div>
        </div>
      </div>
    </div>
    <div class="content" id="viewContainer"></div>
  </div>
</div>

<!-- MODAL dengan tombol close -->
<div id="modal" onclick="if(event.target.id==='modal')closeModal()">
  <div class="modal-box" id="modalBox">
    <button class="modal-close" type="button" onclick="closeModal()" aria-label="Tutup">✕</button>
    <div id="modalContent"></div>
  </div>
</div>

<div id="toast"></div>
<div id="loading" class="hidden"><div class="spinner"></div></div>

<!-- SheetJS untuk Export/Import Excel -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script type="module" src="script.js"></script>
</body>
</html>
